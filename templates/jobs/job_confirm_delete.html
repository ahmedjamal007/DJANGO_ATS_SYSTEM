{% extends "base.html" %}

{% block title %}حذف وظيفة &middot; منصة التوظيف{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <h1 class="text-2xl font-bold text-slate-900">حذف الوظيفة</h1>

  <div class="mt-6 rounded-lg border border-red-200 bg-white p-6">
    <p class="text-sm text-slate-700">
      هل تريد حذف <span class="ltr font-semibold">{{ job.title }}</span>؟ لا يمكن التراجع عن هذا الإجراء.
    </p>

    <form method="post" class="mt-6 flex items-center gap-3">
      {% csrf_token %}
      <button type="submit"
              class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">
        نعم، احذف
      </button>
      <a href="{% url 'jobs:my_jobs' %}" class="text-sm text-slate-500 hover:underline">إلغاء</a>
    </form>
  </div>
</div>
{% endblock %}
